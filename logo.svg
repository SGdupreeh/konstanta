<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 202 238" width="200" height="236" fill="none" role="img" aria-label="ООО «Константа»">
  <title>ООО «Константа» — Фирменный знак</title>
  <desc>Архитектурный строительный портал из сопряжённых несущих элементов</desc>
  <style>
    .brand-portal-graphite {
      fill: #1e293b;
      transition: fill 0.2s ease;
    }
    .brand-portal-blue {
      fill: #177dbb;
      transition: fill 0.2s ease;
    }
    @media (prefers-color-scheme: dark) {
      .brand-portal-graphite.auto-theme { fill: #f8fafc; }
      .brand-portal-blue.auto-theme { fill: #38bdf8; }
    }
  </style>
  <!-- Верхний правый элемент: Архитектурный конструкционный графит -->
  <polygon class="brand-portal-graphite" points="67,13 198,38 198,154 148,154 148,70 67,61" />
  <!-- Нижний левый элемент: Фирменный московский синий -->
  <polygon class="brand-portal-blue" points="0,0 0,234 198,219 198,174 47,177 47,9" />
</svg>